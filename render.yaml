services:
  - type: web
    name: zahgo-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: 8080
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: JWT_SECRET
        generateValue: true
        sync: false
